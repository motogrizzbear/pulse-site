<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f8fb">
  <link rel="icon" href="/pulse-site/assets/favicon.svg" type="image/svg+xml">
  <title>Page not found — Pulse</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("pulse-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="/pulse-site/assets/site.css">
  <script defer src="/pulse-site/assets/theme.js"></script>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for does not exist or has moved.</p>
      <a class="button button-primary" href="/pulse-site/">Back to Pulse</a>
      <button class="theme-toggle error-theme-toggle" type="button" aria-label="Theme: System. Switch to light theme.">◐ System</button>
    </div>
  </main>
</body>
</html>
